# Runs Disco Controller on a Raspberry Pi 5 (linux/arm64) or any Docker host.
#   cp .env.example .env   # set APP_SECRET, PUBLIC_BASE_URL, SMTP_URL...
#   docker compose up -d --build
# See docs/deployment.md for the tunnel, backups, and Square webhook setup.
services:
  app:
    build:
      context: .
      platforms: [linux/arm64]
    image: disco-controller:latest
    platform: linux/arm64
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/disco.db
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data:/data

  # Continuous backup to Backblaze B2. Needs LITESTREAM_* and DISCO_DB_PATH=/data/disco.db in .env.
  litestream:
    image: litestream/litestream:0.5.17
    platform: linux/arm64
    restart: unless-stopped
    command: replicate
    env_file: .env
    environment:
      DISCO_DB_PATH: /data/disco.db
    volumes:
      - ./data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
